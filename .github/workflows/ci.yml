name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
          
      - name: Format Check
        run: dotnet format --verify-no-changes
        
      - name: Manifest Validation
        run: python3 tools/ci/validate_manifests.py

  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - EditMode
          - PlayMode
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          
      - uses: actions/cache@v4
        with:
          path: sample-game/Library
          key: Library-sample-game-${{ runner.os }}-${{ hashFiles('sample-game/Packages/manifest.json') }}
          restore-keys: |
            Library-sample-game-${{ runner.os }}-
            
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: sample-game
          unityVersion: 6000.3.8f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Unity Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - Android
          - iOS
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          
      - uses: actions/cache@v4
        with:
          path: sample-game/Library
          key: Library-sample-game-${{ runner.os }}-${{ matrix.targetPlatform }}-${{ hashFiles('sample-game/Packages/manifest.json') }}
          restore-keys: |
            Library-sample-game-${{ runner.os }}-${{ matrix.targetPlatform }}-
            
      - name: Setup BuildRunner
        run: |
          mkdir -p sample-game/Assets/_Project/Editor
          cp tools/build/BuildRunner.cs sample-game/Assets/_Project/Editor/BuildRunner.cs
          
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: sample-game
          unityVersion: 6000.3.8f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Nimbus.Build.BuildRunner.Build${{ matrix.targetPlatform }}
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: sample-game/Builds
